services:
  postgres:
    image: postgres:16-alpine
    container_name: pg_pritani_dbv2
    environment:
      POSTGRES_USER: muhless
      POSTGRES_PASSWORD: MUHLESS717GG
      POSTGRES_DB: pg_pritani_db
    ports:
      - "5432:5432"
    volumes:
      - pg_pritani_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: pg_pritani_app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pg_pritani_data:
